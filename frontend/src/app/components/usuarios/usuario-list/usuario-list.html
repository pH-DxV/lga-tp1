<mat-toolbar class="mat-toolbar">
    <div class="flex-container">
        <span class="toolbar-title">Controle de Usuários</span>

        <button mat-fab class="accent" routerLink="/usuarios/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input matInput
           (keyup)="applyFilter($event)"
           placeholder="Ex. João"
           #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>
        <td mat-cell *matCellDef="let obj">
            {{obj.id}}
        </td>
    </ng-container>

    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let obj">
            {{obj.nome}}
        </td>
    </ng-container>

    <ng-container matColumnDef="login">
        <th mat-header-cell *matHeaderCellDef> Login </th>
        <td mat-cell *matCellDef="let obj">
            {{obj.login}}
        </td>
    </ng-container>

    <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef> CPF </th>
        <td mat-cell *matCellDef="let obj">
            {{obj.cpf}}
        </td>
    </ng-container>

    <ng-container matColumnDef="perfil">
        <th mat-header-cell *matHeaderCellDef> Perfil </th>
        <td mat-cell *matCellDef="let obj">
            {{obj.perfis[0]?.label}}
        </td>
    </ng-container>

    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>

        <td mat-cell *matCellDef="let obj">
            <button mat-icon-button
                    color="primary"
                    routerLink="/usuarios/edit/{{obj.id}}">
                <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="excluir(obj.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>


<mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
</mat-paginator>
