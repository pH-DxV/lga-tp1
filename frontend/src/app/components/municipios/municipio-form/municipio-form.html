<mat-toolbar class="mat-toolbar">
    <span>{{ form.value.id ? 'Editar Município' : 'Novo Município' }}</span>
</mat-toolbar>

<mat-card>

    <mat-card-content>

        <form [formGroup]="form">

            <mat-form-field appearance="outline">
                <mat-label>Nome</mat-label>

                <input
                    matInput
                    formControlName="nome"
                    placeholder="Ex. Palmas">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Estado</mat-label>

                <mat-select formControlName="idEstado">

                    @for (estado of estados; track estado.id) {
                        <mat-option [value]="estado.id">
                            {{ estado.nome }} - {{ estado.sigla }}
                        </mat-option>
                    }

                </mat-select>

            </mat-form-field>

        </form>

    </mat-card-content>

    <mat-card-actions>

        <button
            mat-raised-button
            color="primary"
            (click)="salvar()">
            <mat-icon>save</mat-icon>
            Salvar
        </button>

        @if (form.value.id) {
            <button
                mat-raised-button
                color="warn"
                (click)="excluir()">
                <mat-icon>delete</mat-icon>
                Excluir
            </button>
        }

        <button
            mat-button
            (click)="voltar()">
            Cancelar
        </button>

    </mat-card-actions>

</mat-card>
