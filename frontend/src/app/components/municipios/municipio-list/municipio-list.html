<mat-toolbar class="mat-toolbar">
    <div class="flex-container">
        <span class="toolbar-title">Controle de Municípios</span>

        <button mat-fab class="accent" routerLink="/municipios/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Ex. Palmas"
        #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>

        <td mat-cell *matCellDef="let obj">
            {{obj.id}}
        </td>
    </ng-container>

    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>

        <td mat-cell *matCellDef="let obj">
            {{obj.nome}}
        </td>
    </ng-container>

    <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>

        <td mat-cell *matCellDef="let obj">
            {{obj.estado?.nome}}
        </td>
    </ng-container>

    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>

        <td mat-cell *matCellDef="let obj">

            <button
                mat-icon-button
                color="primary"
                routerLink="/municipios/edit/{{obj.id}}">
                <mat-icon>edit</mat-icon>
            </button>

            <button
                mat-icon-button
                color="warn"
                (click)="excluir(obj.id)">
                <mat-icon>delete</mat-icon>
            </button>

        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
</mat-paginator>
