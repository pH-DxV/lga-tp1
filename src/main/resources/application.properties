# ==============================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (PostgreSQL)
# ==============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=topicos1
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos1db

# ==============================================================================
# CONFIGURAÇÃO DO SERVIDOR E HTTP
# ==============================================================================
# Porta onde a API vai rodar
quarkus.http.port=8080

# Habilita CORS (permite que Front-ends acessem a API)
quarkus.http.cors=true

# Desabilita serviços automáticos (Docker), pois já temos o banco local instalado
quarkus.devservices.enabled=false

# ==============================================================================
# CONFIGURAÇÃO DO HIBERNATE / JPA
# ==============================================================================
# 'drop-and-create': Apaga e recria o banco a cada reinício (Útil para desenvolvimento inicial)
# Mude para 'update' quando quiser que os dados persistam entre reinícios
quarkus.hibernate-orm.database.generation=drop-and-create

# Logs do SQL no console (Essencial para debugar queries)
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# ==============================================================================
# CONFIGURAÇÃO DE TRATAMENTO DE ERROS (RFC 7807 - Problem Details)
# ==============================================================================
# Define a URL base que aparecerá nos links de erro (campo "type")
%dev.problem.base-url=http://localhost:8080
%test.problem.base-url=http://localhost:8081
%prod.problem.base-url=https://api.seusistema.com

# ==============================================================================
# CONFIGURAÇÃO DE SEGURANÇA (JWT)
# ==============================================================================
# O emissor do token. Deve ser IDÊNTICO ao definido no JwtServiceImpl.java
mp.jwt.verify.issuer=unitins-jwt

# Localização da Chave PÚBLICA (usada para validar o token recebido)
mp.jwt.verify.publickey.location=classpath:token/publicKey.pem

# Localização da Chave PRIVADA (usada para assinar/gerar o token no login)
smallrye.jwt.sign.key.location=classpath:token/privateKey.pem